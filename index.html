<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azur · Villas en venta y renta en la Costa Azul</title>
<meta name="description" content="Villas en venta y en renta entre Saint-Tropez y Mónaco.">
<meta name="theme-color" content="#0F1E3D">
<meta property="og:title" content="Azur · Villas en la Costa Azul">
<meta property="og:description" content="Villas en renta entre Saint-Tropez y Mónaco.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1E3D'/%3E%3Cpath d='M9 19a7 7 0 0 1 14 0M4 19h24M8 23h16' stroke='%23fff' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="site">
  <div class="site-inner">
    <a class="brand" href="#inicio" aria-label="Azur, inicio">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 19a7 7 0 0 1 14 0"/><path d="M4 19h24M8 23h16M12 27h8"/></svg>
      <span class="wordmark">Azur</span>
    </a>
    <div class="header-tools">
      <label class="currency"><span class="sr-only">Moneda</span>
        <select id="currency"><option>MXN</option><option>EUR</option><option>USD</option></select>
      </label>
      <a class="saved-link" href="#guardadas" aria-label="Guardadas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.5 0 5.4 3.5 4.1 6.8-1.8 4.6-9.3 9.2-9.3 9.2Z"/></svg>
        <span class="saved-count" id="savedCount">0</span>
      </a>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="cover" id="cover" aria-label="Residencia destacada"></section>

  <section class="intro wrap" id="coleccion">
    <h2 id="pageTitle">Villas</h2>
    <p id="pageSub"></p>
  </section>

  <div class="toolbar wrap">
    <div class="zones" id="zones" role="group" aria-label="Zona"></div>
    <div class="toolbar-right">
      <div class="view-switch op-switch" role="group" aria-label="Operación">
        <button type="button" data-op="comprar" aria-pressed="true">Comprar</button>
        <button type="button" data-op="rentar" aria-pressed="false">Rentar</button>
      </div>
      <label class="sort"><span class="sr-only">Ordenar</span>
        <select id="sort">
          <option value="precio-desc">Más exclusivas</option>
          <option value="precio-asc">Precio más bajo</option>
          <option value="recomendadas">Mejor valor por m²</option>
        </select>
      </label>
      <div class="view-switch" role="group" aria-label="Vista">
        <button type="button" data-mode="lista" aria-pressed="true">Fotos</button>
        <button type="button" data-mode="mapa" aria-pressed="false">Mapa</button>
      </div>
    </div>
  </div>

  <p class="count wrap" id="resultCount" aria-live="polite"></p>

  <section class="wrap results" id="results" aria-labelledby="pageTitle">
    <div class="grid" id="grid"></div>
    <div class="map-wrap" id="mapWrap" hidden><div class="map" id="map"></div></div>
  </section>

  <section class="closing wrap" aria-labelledby="closingTitle">
    <h2 id="closingTitle">¿Buscas algo en particular?</h2>
    <p>Cuéntanos qué buscas, para comprar o para una temporada, y te proponemos la casa.</p>
    <a class="btn btn-solid" id="closingWa" target="_blank" rel="noopener" href="#">Escríbenos por WhatsApp</a>
  </section>
</main>

<button class="map-fab" id="mapFab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Ver mapa</span></button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fotos" hidden>
  <div class="lb-top"><p id="lbCount"></p><button class="icon-btn light" id="lbClose" aria-label="Cerrar fotos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <figure class="lb-stage"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav prev" id="lbPrev" aria-label="Foto anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="lb-nav next" id="lbNext" aria-label="Foto siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="site-footer wrap">
  <p class="fine" id="fxNote"></p>
  <p class="fine">Azur es un proyecto académico: casas, tarifas y contactos son ilustrativos. Fotos: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>. Mapa: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.</p>
</footer>

<script src="js/price-tags.js"></script>
<script src="js/finance.js"></script>
<script src="js/app.js"></script>
</body>
</html>
